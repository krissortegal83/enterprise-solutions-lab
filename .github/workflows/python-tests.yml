name: Portfolio quality checks
on:
  push:
  pull_request:
jobs:
  python-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Python reference implementations
        run: python -m unittest discover -s tests -v
  interactive-demo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify module syntax
        run: npm run check
      - name: Test deterministic business rules
        run: npm test
